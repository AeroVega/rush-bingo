<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070708">
<title>Rush Bingo — Fifty Something Tour</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header>
  <div class="kicker">Fifty Something Tour</div>
  <div class="retro-burst">★ RUSH ★ RUSH ★ RUSH ★</div>
  <h1>Rush Bingo</h1>
</header>
<div class="tabs">
  <button class="tab active" id="t0" onclick="show('connie')">Connie</button>
  <button class="tab" id="t1" onclick="show('brandon')">Brandon</button>
</div>
<section id="game">
  <div class="tools">
    <button class="tool" onclick="resetCard()">Reset this card</button>
    <button class="tool" onclick="window.print()">Print card</button>
  </div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
  <div class="bingo" id="bingo">BINGO — NOW PUT THE PHONE DOWN AND WATCH RUSH.</div>
</section>
</div>
<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
